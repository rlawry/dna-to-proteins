<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From DNA to Protein — Protein Synthesis</title>
<style>
  html,body{margin:0;height:100%;background:#050a18;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;outline:none;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Protein synthesis animation. Press space or the right arrow to advance, left arrow to go back, M to toggle a mutation, L to toggle labels, R to restart."></canvas></div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720, TAU = Math.PI * 2;

function resize(){
  const dpr = window.devicePixelRatio || 1;
  const S = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  cv.width = Math.round(W * S * dpr); cv.height = Math.round(H * S * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const seg = (p, a, b) => ease(clamp((p - a) / (b - a)));
const easeOutBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
let seed = 11; const rand = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rrAdd(x, y, w, h, r){
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r){ ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function wrapText(text, x, y, maxW, lh){
  const words = text.split(' '); let line = '', yy = y;
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = t;
  }
  if (line) ctx.fillText(line, x, yy);
}

/* ---------- the model gene ---------- */
const CODING   = { n: 'ATGCCTGAGAAGTAA', m: 'ATGCCTGTGAAGTAA' };
const TEMPLATE = { n: 'TACGGACTCTTCATT', m: 'TACGGACACTTCATT' };
const MRNA     = { n: 'AUGCCUGAGAAGUAA', m: 'AUGCCUGUGAAGUAA' };
const MUT_I = 7;
const COMP = { A: 'U', U: 'A', G: 'C', C: 'G' };
const BASECOL = { A: '#ff6b6b', T: '#ffd43b', U: '#ffa94d', G: '#51cf66', C: '#4dabf7' };
const AA = {
  Met: { col: '#69db7c', shape: 'circle' },
  Pro: { col: '#ffa94d', shape: 'square' },
  Glu: { col: '#4dabf7', shape: 'diamond' },
  Val: { col: '#ff6b6b', shape: 'hex' },
  Lys: { col: '#da77f2', shape: 'tri' }
};
const aaNames = () => mutated ? ['Met', 'Pro', 'Val', 'Lys'] : ['Met', 'Pro', 'Glu', 'Lys'];
const mseq = () => MRNA[mutated ? 'm' : 'n'];

/* ---------- steps (each keypress = one new word) ---------- */
const STEPS = [
  { k: '', dur: 0, t: 'Press SPACE, the right arrow, or click to begin. Each press reveals the next idea.' },
  { k: 'Chromosome', dur: 2000, t: 'Inside the nucleus, DNA is packed into chromosomes. Each chromosome holds hundreds to thousands of genes. One gene is marked in yellow.' },
  { k: 'DNA', dur: 3400, t: 'Zoom in on the chromosome: it is one long DNA molecule, tightly coiled. DNA is a double strand built from four bases: A, T, G, and C.' },
  { k: 'Gene', dur: 1500, t: 'A gene is one section of DNA. The order of its bases is a code: the instructions for building one protein.',
    m: 'MUTATION: one base in this gene has changed (circled). Keep pressing to see where that change ends up.' },
  { k: 'Transcription', dur: 5200, t: 'The DNA unzips at the gene, and its code is copied into RNA. Bases pair up: A–U, T–A, G–C, C–G.',
    m: 'The DNA unzips and its code is copied into RNA, including the changed base.' },
  { k: 'mRNA', dur: 5200, t: 'The copy is messenger RNA (mRNA). It carries the code out of the nucleus while the DNA stays inside. RNA uses U in place of T.' },
  { k: 'Ribosome', dur: 1800, t: 'In the cytoplasm, a ribosome clamps onto the mRNA. Ribosomes are where proteins are built.' },
  { k: 'Codon', dur: 1800, t: 'The ribosome reads the mRNA three bases at a time. Each three-base “word” is a codon. Most codons stand for one amino acid.' },
  { k: 'tRNA', dur: 2200, t: 'Transfer RNA (tRNA) delivers an amino acid. Its three bases match the codon, so the right amino acid arrives.' },
  { k: 'Amino acid', dur: 3600, t: 'Amino acids are the building blocks of proteins. The ribosome links each new amino acid to the chain, then moves to the next codon.' },
  { k: 'Translation', dur: 7000, t: 'Codon by codon, the mRNA code is translated into a chain of amino acids. A stop codon ends the chain and releases it.',
    m: 'The changed codon (GUG) called for a different amino acid: Val instead of Glu.' },
  { k: 'Protein', dur: 3600, t: 'The chain folds into a 3-D shape. The order of the amino acids decides the shape. Real proteins have hundreds of amino acids.',
    m: 'One different amino acid changes how the chain folds. The pocket is gone.' },
  { k: 'Function', dur: 3800, t: 'A protein’s shape determines its job. This enzyme’s pocket fits its target, so it can make a purple pigment.',
    m: 'The misshapen enzyme can’t hold its target, so no pigment is made.' },
  { k: 'Trait', dur: 3200, t: 'Proteins at work in cells produce traits. Here, the pigment makes the flower purple.',
    m: 'With no pigment, the flower is white. One changed DNA base led to a different trait.' },
  { k: 'Summary', dur: 2400, t: 'DNA → mRNA → amino acid chain → protein shape → function → trait. Press M to see what one DNA base change does.',
    m: 'A change in DNA can change the protein, and that can change the trait. Press M to return to the original gene.' }
];

let step = 0, t0 = performance.now(), kwT = performance.now(), mutated = false, labels = false, flashT = -1e9;
function go(s, instant){
  step = clamp(s, 0, STEPS.length - 1);
  t0 = instant ? -1e9 : performance.now();
  kwT = performance.now();
}
function progress(){ const d = STEPS[step].dur; return d ? clamp((performance.now() - t0) / d) : 1; }
function next(){
  if (progress() < 1) t0 = -1e9;           // first press finishes a running animation
  else if (step < STEPS.length - 1) go(step + 1);
}
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'Enter' || k === 'PageDown' || k === 'ArrowDown'){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'Backspace' || k === 'PageUp' || k === 'ArrowUp'){ e.preventDefault(); go(step - 1, true); }
  else if (k === 'm' || k === 'M'){ mutated = !mutated; flashT = performance.now(); go(3); }
  else if (k === 'l' || k === 'L'){ labels = !labels; }
  else if (k === 'r' || k === 'R'){ mutated = false; go(0, true); }
});
cv.addEventListener('click', () => { cv.focus(); next(); });
cv.focus();

/* ---------- layout constants ---------- */
const GX = 135, gx = i => GX + 26 * i;            // gene position in nucleus
const MX0 = 760, MY = 470;                         // mRNA in cytoplasm
const cxCodon = i => MX0 + 78 * i + 39;
const TRNA_TOP = 308;
const C = { x: 905, y: 235 };                      // where the protein folds
const RELEASED = [0, 1, 2, 3].map(j => ({ x: 848 + 38 * j, y: 222 + 8 * Math.sin(j * 1.6) }));
const FOLD_N = [[-30, 14], [-6, 36], [24, 22], [32, -6]];
const FOLD_M = [[-30, 16], [-8, 36], [14, -58], [32, 8]];
const FL_T = { '-2': 'G', '-1': 'C', '15': 'A', '16': 'G' };
const FL_B = { '-2': 'C', '-1': 'G', '15': 'T', '16': 'C' };
const flT = i => FL_T[i] || 'GATCCGTA'[(i + 16) % 8];
const flB = i => FL_B[i] || ({ A: 'T', T: 'A', G: 'C', C: 'G' })[flT(i)];
const PART = [...Array(80)].map(() => ({ x: rand() * W, y: 90 + rand() * 540, r: .6 + rand() * 1.8, v: .2 + rand() * .7, ph: rand() * 6 }));

/* ---------- primitives ---------- */
function drawBase(x, yb, dir, L, alpha, letterA, ring){
  if (alpha <= 0) return;
  const y = dir > 0 ? yb + 2 : yb - 24;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = BASECOL[L]; rr(x + 3, y, 20, 22, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x + 6, y + (dir > 0 ? 14 : 2), 14, 5, 2.5); ctx.fill();
  if (letterA > 0){
    ctx.globalAlpha *= letterA; ctx.fillStyle = '#10131c';
    ctx.font = 'bold 15px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(L, x + 13, y + 12);
  }
  ctx.restore();
  if (ring){
    ctx.save(); ctx.globalAlpha *= alpha;
    ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 3; ctx.shadowColor = '#ff2d55';
    ctx.shadowBlur = 8 + 6 * Math.sin(NOW * .006);
    rr(x, y - 3, 26, 28, 8); ctx.stroke(); ctx.restore();
  }
}
function backbone(pts, col, alpha = 1){
  if (pts.length < 2) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
  ctx.fillStyle = col; for (const p of pts){ ctx.beginPath(); ctx.arc(p[0], p[1], 4.5, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function drawAA(name, x, y, r, alpha, showText = true){
  if (alpha <= 0) return;
  const s = AA[name];
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = s.col; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (s.shape === 'circle') ctx.arc(x, y, r, 0, TAU);
  else if (s.shape === 'square') rr(x - r * .9, y - r * .9, r * 1.8, r * 1.8, r * .3);
  else if (s.shape === 'diamond'){ ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x + r * 1.2, y); ctx.lineTo(x, y + r * 1.2); ctx.lineTo(x - r * 1.2, y); ctx.closePath(); }
  else if (s.shape === 'hex'){ for (let k = 0; k < 6; k++){ const a = k * Math.PI / 3; ctx[k ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r * 1.1, y + Math.sin(a) * r * 1.1); } ctx.closePath(); }
  else { ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x + r * 1.15, y + r * .85); ctx.lineTo(x - r * 1.15, y + r * .85); ctx.closePath(); }
  ctx.fill(); ctx.stroke();
  if (showText && r >= 10){
    ctx.fillStyle = '#10131c'; ctx.font = `bold ${Math.round(r * .72)}px system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name, x, y + (s.shape === 'tri' ? r * .25 : 0) + 1);
  }
  if (mutated && name === 'Val' && r >= 8){
    ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 3; ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(x, y, r + 7, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function drawChain(pts, names, r, bonds){
  ctx.save(); ctx.strokeStyle = '#e9ecef'; ctx.lineWidth = Math.max(3, r * .35); ctx.lineCap = 'round';
  for (let k = 0; k < pts.length - 1; k++){
    const a = bonds ? bonds[k] : 1; if (!a) continue;
    ctx.globalAlpha = (pts[k].a ?? 1) * a;
    ctx.beginPath(); ctx.moveTo(pts[k].x, pts[k].y); ctx.lineTo(pts[k + 1].x, pts[k + 1].y); ctx.stroke();
  }
  ctx.restore();
  pts.forEach((p, k) => drawAA(names[k], p.x, p.y, r, p.a ?? 1));
}
function tag(text, x, y, a, col = '#ffffff'){
  if (a <= 0 || !labels) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = '600 14px system-ui,sans-serif';
  const w = ctx.measureText(text).width + 18;
  ctx.fillStyle = 'rgba(8,14,32,.82)'; rr(x - w / 2, y - 12, w, 24, 12); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 1);
  ctx.restore();
}

/* ---------- background & title ---------- */
let NOW = 0;
function background(now){
  ctx.fillStyle = '#0d1733'; ctx.fillRect(0, 0, W, H);
  for (const p of PART){
    const x = (p.x + now * .004 * p.v) % W, y = p.y + Math.sin(now * .0006 + p.ph) * 6;
    ctx.fillStyle = `rgba(160,190,255,${.08 + .07 * Math.sin(now * .001 + p.ph)})`;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.fill();
  }
}
/* ---------- opening-screen double helix ---------- */
const HX0 = 90, HX1 = 1190, HR = 66, HCY = 268, HPER = 240, HSTEP = 22;
const HDEL = 2.45;   // the two backbones are ~140° apart, not 180°: narrow minor groove on one side, wide major groove on the other
const HSEQ = 'ATGCCTGAGAAGTAAGCTAGCATGCATCGATCGTAGCTAGGATCCATGAGTCCAGT';
const HCOMP = { A: 'T', T: 'A', G: 'C', C: 'G' };
function helixPhase(x, t){ return (x - HX0) / HPER * TAU + t; }
function helixPass(t, front, fade){
  ctx.lineCap = 'round';
  for (const strand of [0, 1]){
    const off = strand ? HDEL : 0, col = strand ? '#9775fa' : '#b197fc';
    const dim = mix(col, '#0d1733', .55);
    for (let x = HX0; x < HX1; x += 3){
      const ph = helixPhase(x + 1.5, t) + off, d = Math.cos(ph);
      if ((d >= 0) !== front) continue;
      const y1 = HCY + HR * Math.sin(helixPhase(x, t) + off), y2 = HCY + HR * Math.sin(helixPhase(x + 3, t) + off);
      ctx.globalAlpha = fade(x);
      ctx.strokeStyle = front ? col : dim; ctx.lineWidth = front ? 9 : 6;
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x + 3, y2); ctx.stroke();
    }
    // sugar-phosphate dots where each base pair attaches
    for (let i = 0, x = HX0 + 12; x < HX1; i++, x += HSTEP){
      const ph = helixPhase(x, t) + off, d = Math.cos(ph);
      if ((d >= 0) !== front) continue;
      ctx.globalAlpha = fade(x);
      ctx.fillStyle = front ? col : dim;
      ctx.beginPath(); ctx.arc(x, HCY + HR * Math.sin(ph), front ? 8 : 5.5, 0, TAU); ctx.fill();
    }
  }
}
function drawHelix(now){
  const t = now * .0016, fade = x => clamp(Math.min(x - HX0, HX1 - x) / 90);
  ctx.save();
  helixPass(t, false, fade);
  // base-pair rungs, each colored half-and-half for its two bases
  ctx.lineCap = 'butt'; ctx.lineWidth = 7;
  for (let i = 0, x = HX0 + 12; x < HX1; i++, x += HSTEP){
    const ph = helixPhase(x, t), yA = HCY + HR * Math.sin(ph), yB = HCY + HR * Math.sin(ph + HDEL), ym = (yA + yB) / 2;
    const bA = HSEQ[i % HSEQ.length], bB = HCOMP[bA];
    ctx.globalAlpha = fade(x);
    ctx.strokeStyle = BASECOL[bA]; ctx.beginPath(); ctx.moveTo(x, yA); ctx.lineTo(x, ym); ctx.stroke();
    ctx.strokeStyle = BASECOL[bB]; ctx.beginPath(); ctx.moveTo(x, ym); ctx.lineTo(x, yB); ctx.stroke();
  }
  helixPass(t, true, fade);
  ctx.restore();
}

function titleScreen(now){
  drawHelix(now);
  drawTitleText(now);
}

/* ---------- title text that reacts to the cursor ---------- */
const TITLE_LINES = [
  { t: 'From DNA to Protein', font: '800 66px system-ui,sans-serif', size: 66, y: 440, col: '#ffd43b' },
  { t: 'How the structure of DNA determines the structure of proteins', font: '24px system-ui,sans-serif', size: 24, y: 486, col: '#e9ecef' },
  { t: 'Simplified model gene (15 bases)', font: '17px system-ui,sans-serif', size: 17, y: 520, col: 'rgba(233,236,239,.6)' },
  { t: 'Press SPACE to begin', font: '600 20px system-ui,sans-serif', size: 20, y: 572, col: '#ffd43b', pulse: true }
];
let TCH = null, tLast = 0;
function layoutTitle(){
  TCH = [];
  ctx.save(); ctx.textAlign = 'left';
  for (const L of TITLE_LINES){
    ctx.font = L.font;
    const total = ctx.measureText(L.t).width, x0 = W / 2 - total / 2;
    for (let i = 0; i < L.t.length; i++){
      const c = L.t[i], x = x0 + ctx.measureText(L.t.slice(0, i)).width, w = ctx.measureText(c).width;
      if (c === ' ') continue;
      TCH.push({ c, L, x, w, st: 'idle', dx: 0, dy: 0, rot: 0, vx: 0, vy: 0, vr: 0, t: 0, hold: 0, tr: 0, f: null });
    }
  }
  ctx.restore();
}
function kick(ch, now){
  if (ch.st !== 'idle') return;
  ch.t = now;
  if (Math.random() < .5){            // knocked crooked
    ch.st = 'tilt'; ch.tr = (Math.random() < .5 ? -1 : 1) * (.35 + Math.random() * .5);
    ch.hold = 2200 + Math.random() * 1800;
    ch.f = { dx: (Math.random() - .5) * 10, dy: 4 + Math.random() * 8 };
  } else {                             // knocked loose and falls away
    ch.st = 'fall'; ch.vx = (Math.random() - .5) * 220; ch.vy = -120 - Math.random() * 160; ch.vr = (Math.random() - .5) * 9;
    ch.hold = 2400 + Math.random() * 1600;
  }
}
function hoverSweep(x0, y0, x1, y1){
  if (!TCH) layoutTitle();
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 6)), now = performance.now();
  for (let k = 1; k <= n; k++){
    const x = lerp(x0, x1, k / n), y = lerp(y0, y1, k / n);
    for (const ch of TCH){
      if (ch.st !== 'idle') continue;
      const L = ch.L;
      if (x >= ch.x - 3 && x <= ch.x + ch.w + 3 && y >= L.y - L.size * .85 && y <= L.y + L.size * .3) kick(ch, now);
    }
  }
}
function drawTitleText(now){
  if (!TCH) layoutTitle();
  const dt = Math.min(.05, (now - (tLast || now)) / 1000); tLast = now;
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const ch of TCH){
    const e = now - ch.t;
    if (ch.st === 'tilt'){
      const a = ease(clamp(e / 160));
      ch.rot = ch.tr * a; ch.dx = ch.f.dx * a; ch.dy = ch.f.dy * a;
      if (e > ch.hold) beginReturn(ch, now);
    } else if (ch.st === 'fall'){
      ch.vy += 1900 * dt; ch.dx += ch.vx * dt; ch.dy += ch.vy * dt; ch.rot += ch.vr * dt;
      if (e > ch.hold) beginReturn(ch, now);
    } else if (ch.st === 'return'){
      const u = clamp((now - ch.t) / 900), k = 1 - easeOutBack(u);
      ch.dx = ch.f.dx * k; ch.dy = ch.f.dy * k; ch.rot = ch.f.rot * k;
      if (u >= 1){ ch.st = 'idle'; ch.dx = ch.dy = ch.rot = 0; }
    }
    const L = ch.L, cx = ch.x + ch.w / 2 + ch.dx, cy = L.y - L.size * .35 + ch.dy;
    ctx.save();
    ctx.globalAlpha = L.pulse ? .55 + .45 * Math.sin(now * .004) : 1;
    ctx.fillStyle = L.col; ctx.font = L.font;
    ctx.translate(cx, cy); ctx.rotate(ch.rot); ctx.fillText(ch.c, -ch.w / 2, L.size * .35);
    ctx.restore();
  }
  ctx.restore();
}
function beginReturn(ch, now){
  let r = ch.rot - Math.round(ch.rot / TAU) * TAU;   // unwind by the short way
  ch.f = { dx: ch.dx, dy: ch.dy, rot: r };
  ch.st = 'return'; ch.t = now;
}
let mouseP = null;
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (step === 0) hoverSweep(mouseP ? mouseP.x : x, mouseP ? mouseP.y : y, x, y);
  mouseP = { x, y };
});
cv.addEventListener('pointerleave', () => { mouseP = null; });

/* ---------- top flow chart ---------- */
const NODES = ['DNA', 'mRNA', 'Amino acids', 'Protein', 'Trait'];
const NODECOL = ['#b197fc', '#ff8cc6', '#69db7c', '#38d9a9', '#c084fc'];
const ARROWS = ['transcription', 'translation', 'folding', 'function'];
function topBar(V){
  const w = 150, h = 42, y = 24, gap = (W - 100 - 5 * w) / 4;
  const lit = [V(2), V(5), V(10), V(11, .5, 1), V(13)];
  const al = [V(4), V(8), V(11, 0, .5), V(12)];
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 5; i++){
    const x = 50 + i * (w + gap);
    ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.5;
    rr(x, y, w, h, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.font = '700 17px system-ui,sans-serif'; ctx.fillText(NODES[i], x + w / 2, y + h / 2 + 1);
    if (lit[i] > 0){
      ctx.globalAlpha = lit[i];
      ctx.fillStyle = NODECOL[i] + '33'; ctx.strokeStyle = NODECOL[i]; ctx.lineWidth = 2.5;

/* ---------- mRNA ---------- */
function drawMRNA(V, s, p){

/* ---------- translation state ---------- */
function chainLayout(n, ax, ay){
  const pts = [];
  for (let k = 0; k < n; k++){
    const o = n - 1 - k;
    pts.push({ x: ax - 20 * o, y: ay - 26 * o + (o ? 5 * Math.sin(o * 1.7) : 0) });
  }
  return pts;
}
function trans(u){
  const out = { r: 0, tr: [], pts: [], bonds: [], split: 0, stop: 0 };
  if (u <= 0) return out;
  const i = Math.min(4, Math.floor(u)), f = u >= 5 ? 1 : u - i;
  if (i >= 1 && i <= 3) out.r = (i - 1) + seg(f, .7, 1);
  if (i >= 4) out.r = 3;
  for (let j = 0; j < 4; j++){
    if (u < j) continue;
    let x = cxCodon(j), dy = 0, a = 1;
    if (j === i){ dy = -320 * (1 - seg(f, 0, .5)); a = seg(f, 0, .15); }
    if (i > j){
      const lf = (j === 3 && i === 4) ? seg(f, .45, 1) : (i === j + 1 ? seg(f, .7, 1) : 1);
      if (lf >= 1) continue;
      dy = -260 * lf; x -= 70 * lf; a = 1 - lf;
    }
    out.tr.push({ j, x, dy, a });
  }
  if (i === 0){
    const t = out.tr.find(o => o.j === 0);
    out.pts = [{ x: t.x, y: TRNA_TOP + t.dy, a: t.a }];
  } else if (i <= 3){
    const t = out.tr.find(o => o.j === i), b = seg(f, .5, .7);
    const before = chainLayout(i, cxCodon(i - 1), TRNA_TOP), after = chainLayout(i + 1, cxCodon(i), TRNA_TOP);
    for (let k = 0; k < i; k++) out.pts.push({ x: lerp(before[k].x, after[k].x, b), y: lerp(before[k].y, after[k].y, b) });
    out.pts.push({ x: t.x, y: TRNA_TOP + t.dy, a: t.a });
    for (let k = 0; k < i; k++) out.bonds.push(k < i - 1 ? 1 : b);
  } else {
    const rel = u >= 5 ? 1 : seg(f, .4, 1);
    const a = chainLayout(4, cxCodon(3), TRNA_TOP);
    for (let k = 0; k < 4; k++) out.pts.push({ x: lerp(a[k].x, RELEASED[k].x, rel), y: lerp(a[k].y, RELEASED[k].y, rel) });
    out.bonds = [1, 1, 1];
    out.split = u >= 5 ? 1 : seg(f, .45, 1);
    out.stop = u >= 5 ? 0 : seg(f, 0, .2) * (1 - seg(f, .8, 1));
  }
  return out;
}

function ribosome(X, a, split, part){

/* ---------- protein shape ---------- */
function rAt(th, mut){
  let d = th + Math.PI / 2; d = Math.atan2(Math.sin(d), Math.cos(d));
  let r = 62 * (1 + .07 * Math.sin(3 * th + .6) + .04 * Math.cos(5 * th + 1));

  else r -= 30 * Math.exp(-(d * d) / (2 * .09));
  return r;
}
function drawBlob(cx, cy, sc, mut, a){

  for (let k = 0; k <= 140; k++){

/* ---------- the cell scene (steps 1–10) ---------- */
function cellScene(now, p, V){
  const s = step;
  // drifting free amino acids in the cytoplasm (decoration)
  const fa = V(6) * .16;
  if (fa > 0){
    const nm = ['Met', 'Pro', 'Glu', 'Lys', 'Val'];
    for (let k = 0; k < 9; k++){
      const x = 660 + ((k * 137 + now * .008 * (k % 3 + 1)) % 590), y = 120 + ((k * 89) % 400) + Math.sin(now * .0008 + k) * 10;

    }
  }

  zoomMap(V(2, .7, 1) * (1 - V(12, 0, .3)));
  tag('Nucleus', 175, 500, V(1, .5, 1), '#d0bfff');
  tag('Cytoplasm', 700, 112, V(1, .5, 1), '#a5d8ff');
  chromosomes(V);
  dna(V);

  // translation state

  if (s === 8) u = .6 * p; else if (s === 9) u = .6 + 1.4 * p; else if (s === 10) u = 2 + 3 * p; else if (s > 10) u = 5;
  const T = trans(u);

  const asm = 1 - a5;

  // codon key under the codons
  const keyA = V(7, .4, 1) * (1 - V(11, 0, .4));
  if (keyA > 0){
    ctx.save(); ctx.globalAlpha *= keyA;
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '600 13px system-ui,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('codon key', MX0 - 12, 588);
    const seq = mseq(), names = aaNames();
    for (let c = 0; c < 5; c++){
      const cx = cxCodon(c);
      ctx.fillStyle = 'rgba(255,255,255,.06)'; rr(cx - 36, 562, 72, 54, 10); ctx.fill();
      ctx.textAlign = 'center'; ctx.font = 'bold 14px ui-monospace,Menlo,Consolas,monospace';
      ctx.fillStyle = (mutated && c === 2) ? '#ff8fa3' : '#ffe8cc';
      ctx.fillText(seq.slice(3 * c, 3 * c + 3), cx, 576);
      if (c < 4){ drawAA(names[c], cx - 18, 600, 7, 1, false); ctx.fillStyle = '#e9ecef'; ctx.font = '600 13px system-ui,sans-serif'; ctx.fillText(names[c], cx + 8, 601); }
      else { ctx.fillStyle = '#ff6b6b'; ctx.font = '800 13px system-ui,sans-serif'; ctx.fillText('STOP', cx, 601); }
    }
    ctx.restore();
  }

  ctx.save(); ctx.translate(0, 60 * asm); ribosome(X, ribA, T.split, 'small'); ctx.restore();
  ctx.save(); ctx.translate(0, -60 * asm); ribosome(X, ribA, T.split, 'largeFill'); ctx.restore();

  // codon tints
  const ct = V(7, 0, .6) * (1 - V(11, 0, .4));
  if (ct > 0){
    for (let c = 0; c < 5; c++){
      ctx.save(); ctx.globalAlpha *= ct;
      ctx.fillStyle = c % 2 ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.07)';
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
      rr(MX0 + 78 * c + 2, MY - 30, 74, 36, 8); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }

  const mp = drawMRNA(V, s, p);
  ctx.save(); ctx.translate(0, -60 * asm); ribosome(X, ribA, T.split, 'largeLine'); ctx.restore();

  // tRNAs and the growing chain

  }

    const pts = RELEASED.map((r0, k) => ({ x: lerp(r0.x, C.x + F[k][0], f), y: lerp(r0.y, C.y + F[k][1], f) }));
    drawChain(pts, aaNames(), lerp(13, 11, f));

  }

  // labels
  if (mp && s >= 4 && s <= 6) tag('mRNA', mp.x0 + 195, mp.y + 24, s === 4 ? V(4, .6, .9) : 1, '#ff8cc6');
  if (s === 5) tag('nuclear pore', 600, 512, seg(p, .3, .45) * (1 - seg(p, .9, 1)), '#d0bfff');
  if (s >= 6 && s <= 9) tag('ribosome', X + 140, 395, a5, '#99e9f2');

}

  ['Antibodies', 'help fight infection']
];
function dockYFor(cy, sc){ return cy - (rAt(-Math.PI / 2, mutated) + 17) * sc; }
function functionPanel(V){
  const m = V(12, 0, .35), sc = lerp(1, 1.7, m), cx = lerp(C.x, 380, m), cy = lerp(C.y, 390, m);
  drawBlob(cx, cy, sc, mutated, 1);
  const F = mutated ? FOLD_M : FOLD_N;
  drawChain(F.map(([dx, dy]) => ({ x: cx + dx * sc, y: cy + dy * sc })), aaNames(), 11 * sc);
  tag('enzyme (a protein)', cx, cy + (rAt(Math.PI / 2, mutated) + 24) * sc, V(12, .3, .6), '#96f2d7');

  const tr = 17 * sc, dockY = dockYFor(cy, sc);
  let tx = cx, ty, ta = V(12, .3, .42), col = '#ffd43b', glow = 0;
  if (!mutated){
    ty = lerp(140, dockY, V(12, .35, .7)); const c = V(12, .7, 1); col = mix('#ffd43b', '#9b5de5', c); glow = c;
  } else {
    const t1 = V(12, .35, .6), t2 = V(12, .6, 1);
    ty = lerp(140, dockY, t1) - 110 * t2; tx = cx + 150 * t2; ta *= 1 - .5 * t2;
  }
  if (ta > 0){
    ctx.save(); ctx.globalAlpha *= ta;
    if (glow > 0){ ctx.shadowColor = '#cc5de8'; ctx.shadowBlur = 25 * glow; }
    ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tx, ty, tr, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (glow > 0){
      for (let k = 0; k < 10; k++){
        const a = k / 10 * TAU + NOW * .001, d = tr + 10 + 16 * glow;
        ctx.save(); ctx.globalAlpha = glow * .8; ctx.fillStyle = '#d0a3ff';
        ctx.beginPath(); ctx.arc(tx + Math.cos(a) * d, ty + Math.sin(a) * d, 3, 0, TAU); ctx.fill(); ctx.restore();
      }
    }
    tag(glow > .5 ? 'pigment made!' : 'target molecule', tx + tr + 75, ty, ta, glow > .5 ? '#d0a3ff' : '#ffe066');
  }
  if (mutated){
    const xa = V(12, .62, .85);
    if (xa > 0){
      const xx = cx, yy = dockY + 6;
      ctx.save(); ctx.globalAlpha = xa; ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(xx - 18, yy - 18); ctx.lineTo(xx + 18, yy + 18); ctx.moveTo(xx + 18, yy - 18); ctx.lineTo(xx - 18, yy + 18); ctx.stroke();
      ctx.restore();
      tag("doesn't fit", xx - 95, yy, xa, '#ff8fa3');
    }
  }
  // the many jobs of proteins
  const ca = V(12, .15, .75) * (1 - V(13, 0, .3));
  if (ca > 0){
    ctx.save(); ctx.globalAlpha = ca;
    ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Proteins do the work of cells:', 740, 160);
    ctx.restore();
    CHIPS.forEach(([n, d], i) => {
      const a = clamp(ca * 1.5 - i * .1); if (a <= 0) return;
      const y = 180 + 72 * i;
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = i === 0 ? 'rgba(56,217,169,.14)' : 'rgba(255,255,255,.05)';
      ctx.strokeStyle = i === 0 ? '#38d9a9' : 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
      rr(740 + 20 * (1 - a), y, 470, 58, 14); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '700 19px system-ui,sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(n + (i === 0 ? '  ← this example' : ''), 764, y + 25);
      ctx.fillStyle = 'rgba(233,236,239,.7)'; ctx.font = '15px system-ui,sans-serif'; ctx.fillText(d, 764, y + 46);
      ctx.restore();
    });
  }
}

/* ---------- trait panel (step 12+) ---------- */
function flower(bx, g, pt, petal){
  if (g <= 0) return;
  const by = 600, top = lerp(by, 345, g);
  ctx.save();
  ctx.fillStyle = '#5c3d2e'; ctx.beginPath(); ctx.ellipse(bx, by + 6, 70, 12, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#40c057'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx - 28, (by + top) / 2, bx, top); ctx.stroke();
  const lf = seg(g, .4, 1);
  if (lf > 0){
    ctx.fillStyle = '#51cf66';
    ctx.beginPath(); ctx.ellipse(bx - 38, 535, 28 * lf, 10 * lf, -.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 14, 488, 26 * lf, 9 * lf, .5, 0, TAU); ctx.fill();
  }
  if (pt > 0){
    ctx.translate(bx, top);
    for (let k = 0; k < 6; k++){
      ctx.save(); ctx.rotate(k * Math.PI / 3 + .2);
      ctx.beginPath(); ctx.ellipse(0, -40 * pt, 20 * pt, 36 * pt, 0, 0, TAU);
      ctx.fillStyle = petal; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(0, 0, 14 * pt, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function traitPanel(V){
  const bx = 990, g = V(13, 0, .55), pt = V(13, .35, .8), colT = V(13, .5, 1);
  if (!mutated){
    const f = V(13, 0, .75), sy = dockYFor(390, 1.7);
    for (let i = 0; i < 24; i++){
      const lt = clamp(f * 1.5 - i * .022); if (lt <= 0 || lt >= 1) continue;
      const q = 1 - lt, x = q * q * 380 + 2 * q * lt * 720 + lt * lt * bx, y = q * q * sy + 2 * q * lt * 110 + lt * lt * 345;
      ctx.save(); ctx.globalAlpha = Math.sin(lt * Math.PI); ctx.fillStyle = '#b37bff';
      ctx.shadowColor = '#cc5de8'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill(); ctx.restore();
    }
  }
  flower(bx, g, pt, mutated ? '#f1f3f5' : mix('#f1f3f5', '#9b5de5', colT));
  const la = V(13, .6, 1);
  tag('TRAIT', bx, 258, la, '#e599f7');
  if (la > 0){
    ctx.save(); ctx.globalAlpha = la; ctx.textAlign = 'left';
    ctx.fillStyle = mutated ? '#f1f3f5' : '#d0a3ff'; ctx.font = '800 26px system-ui,sans-serif';
    ctx.fillText(mutated ? 'White flower' : 'Purple flower', bx + 85, 350);
    ctx.fillStyle = 'rgba(233,236,239,.7)'; ctx.font = '16px system-ui,sans-serif';
    ctx.fillText(mutated ? 'no pigment' : 'has pigment', bx + 85, 376);
    ctx.restore();
  }
}

/* ---------- summary (step 13) ---------- */
function summary(V){
  const a = V(14, 0, .4), a2 = V(14, .45, 1);
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(7,12,30,.95)'; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  rr(70, 104, 1140, 506, 24); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = '800 28px system-ui,sans-serif';
  ctx.fillText('How DNA determines proteins — and traits', W / 2, 150);
  const row = (y, items, cols, alpha, arrowLabels) => {
    const w = 150, gap = 36, x0 = 100;
    items.forEach(([l1, l2], i) => {
      const x = x0 + i * (w + gap), ai = clamp(alpha * 1.6 - i * .12);
      ctx.save(); ctx.globalAlpha = a * ai;
      ctx.fillStyle = cols[i] + '22'; ctx.strokeStyle = cols[i]; ctx.lineWidth = 2.5;
      rr(x, y, w, 70, 14); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '700 18px system-ui,sans-serif'; ctx.fillText(l1, x + w / 2, y + (l2 ? 25 : 35));
      if (l2){ ctx.fillStyle = 'rgba(233,236,239,.78)'; ctx.font = '15px system-ui,sans-serif'; ctx.fillText(l2, x + w / 2, y + 48); }
      if (i < items.length - 1){
        const x1 = x + w + 4, x2 = x + w + gap - 4, ym = y + 35;
        ctx.strokeStyle = '#ffd43b'; ctx.fillStyle = '#ffd43b'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x1, ym); ctx.lineTo(x2 - 6, ym); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, ym); ctx.lineTo(x2 - 9, ym - 6); ctx.lineTo(x2 - 9, ym + 6); ctx.closePath(); ctx.fill();
        if (arrowLabels){ ctx.font = 'italic 600 13px system-ui,sans-serif'; ctx.fillText(arrowLabels[i], (x1 + x2) / 2, y - 14); }
      }
      ctx.restore();
    });
  };
  row(232, [['DNA gene', 'base sequence'], ['mRNA', 'codons'], ['Amino acid', 'chain'], ['Protein', 'shape'], ['Protein', 'function'], ['Trait', '']],
      ['#b197fc', '#ff8cc6', '#69db7c', '#38d9a9', '#38d9a9', '#c084fc'], V(14, .1, .7),
      ['transcription', 'translation', 'folding', 'determines', 'produces']);
  ctx.globalAlpha = a * a2; ctx.fillStyle = mutated ? '#ff8fa3' : '#ffc9c9'; ctx.font = '700 20px system-ui,sans-serif';
  ctx.fillText('What if one DNA base changes?', W / 2, 380);
  const red = Array(6).fill('#ff6b6b');
  row(410, [['Changed', 'DNA base'], ['Changed', 'codon'], ['Different', 'amino acid'], ['Different', 'shape'], ["Can't do", 'its job'], ['Different', 'trait']],
      red, a2, null);
  ctx.globalAlpha = a * a2; ctx.fillStyle = 'rgba(233,236,239,.6)'; ctx.font = '15px system-ui,sans-serif';
  ctx.fillText('The structure of DNA determines the structure of proteins, which carry out the essential functions of life.', W / 2, 545);
  ctx.fillText('Not every base change alters the protein, but when the amino acid sequence changes, the shape and function can change.', W / 2, 570);
  ctx.restore();
}

/* ---------- caption & badges ---------- */
function caption(now){
  const st = STEPS[step];
  ctx.fillStyle = '#060b1c'; ctx.fillRect(0, 630, W, 90);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(40, 636, W - 80, 1);
  if (st.k){
    const t = clamp((now - kwT) / 520), sc = t < 1 ? .4 + .6 * easeOutBack(t) : 1;
    ctx.save(); ctx.translate(40, 676); ctx.scale(sc, sc);
    let fs = 46; ctx.font = `800 ${fs}px system-ui,sans-serif`;
    while (ctx.measureText(st.k).width > 315 && fs > 24){ fs -= 2; ctx.font = `800 ${fs}px system-ui,sans-serif`; }
    ctx.fillStyle = '#ffd43b'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.globalAlpha = clamp(t * 2);
    ctx.fillText(st.k, 0, 0); ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = clamp((now - kwT) / 450);
  ctx.fillStyle = '#e9ecef'; ctx.font = '20px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  wrapText((mutated && st.m) ? st.m : st.t, 380, 658, 860, 26);
  ctx.restore();
  ctx.save(); ctx.font = '13px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.42)'; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.fillText(`${step} / ${STEPS.length - 1}`, 40, 712);
  ctx.restore();
  // keyboard shortcuts on an opaque bar
  const keys = [['SPACE / →', 'next'], ['←', 'back'], ['M', 'mutation'], ['L', 'labels ' + (labels ? 'on' : 'off')], ['R', 'restart']];
  ctx.save(); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const kf = '700 12px system-ui,sans-serif', lf = '13px system-ui,sans-serif';
  const parts = keys.map(([k, l]) => { ctx.font = kf; const kw = ctx.measureText(k).width + 12; ctx.font = lf; const lw = ctx.measureText(l).width; return { k, l, kw, lw }; });
  const total = parts.reduce((a, q) => a + q.kw + 6 + q.lw + 16, 0) + 4;
  const bx = W - 30 - total, by = 694, bh = 24;
  ctx.fillStyle = '#1b2445'; ctx.strokeStyle = '#4a5a8c'; ctx.lineWidth = 1.5;
  ctx.fillRect(bx, by, total, bh); ctx.strokeRect(bx, by, total, bh);
  let x = bx + 10; const cy = by + bh / 2;
  for (const q of parts){
    ctx.fillStyle = '#e9ecef'; ctx.fillRect(x, cy - 8, q.kw, 16);
    ctx.fillStyle = '#0d1733'; ctx.font = kf; ctx.fillText(q.k, x + 6, cy + 1);
    x += q.kw + 6;
    ctx.fillStyle = '#e9ecef'; ctx.font = lf; ctx.fillText(q.l, x, cy + 1);
    x += q.lw + 16;
  }
  ctx.restore();
}
function badges(now){
  if (mutated){
    ctx.save(); ctx.fillStyle = 'rgba(255,45,85,.18)'; ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 1.5;
    rr(92, 700, 112, 18, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff8fa3'; ctx.font = '800 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('MUTATION ON', 148, 709.5); ctx.restore();
  }
  const ft = (now - flashT) / 2600;
  if (ft >= 0 && ft < 1){
    const a = Math.min(1, ft * 6, (1 - ft) * 4);
    ctx.save(); ctx.globalAlpha = a;
    const msg = mutated ? 'MUTATION: one base in the gene is changed (T → A on the top strand)' : 'Original gene restored';
    ctx.font = '700 20px system-ui,sans-serif'; const w = ctx.measureText(msg).width + 40;
    ctx.fillStyle = mutated ? 'rgba(120,10,40,.92)' : 'rgba(10,60,50,.92)'; ctx.strokeStyle = mutated ? '#ff2d55' : '#38d9a9'; ctx.lineWidth = 2;
    rr(W / 2 - w / 2, 120, w, 44, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(msg, W / 2, 143);
    ctx.restore();
  }
}

/* ---------- main loop ---------- */
function frame(now){
  NOW = now;
  const s = step, p = progress();
  const V = (k, a = 0, b = 1) => s < k ? 0 : s > k ? 1 : seg(p, a, b);
  background(now);
  if (s === 0) titleScreen(now);
  const dim = 1 - .75 * V(12, 0, .3);
  ctx.save(); ctx.globalAlpha = dim; cellScene(now, p, V); ctx.restore();
  if (s >= 12) functionPanel(V);
  if (s >= 13) traitPanel(V);
  if (s >= 14) summary(V);
  topBar(V);
  caption(now);
  badges(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
